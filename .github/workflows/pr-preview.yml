name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: false

jobs:
  preview:
    # Fork PRs get a read-only token and cannot push to gh-pages.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        if: github.event.action != 'closed'
        run: scripts/build-pages.sh
        # The online jury vote on the music page; see supabase/migrations/.
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          # Absolute links (the music page's link preview): this repository's Pages site, at the
          # domain root for an <owner>.github.io repository, or the repository variable SITE_URL
          # (a custom domain), and the preview under it.
          SITE_URL: ${{ vars.SITE_URL || (github.event.repository.name == format('{0}.github.io', github.repository_owner) && format('https://{0}/', github.event.repository.name) || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name)) }}
          SITE_PATH: pr-preview/pr-${{ github.event.number }}/

      # Publishes to gh-pages under pr-preview/pr-<number>/, comments the URL on the
      # PR, and removes the preview when the PR is closed or merged.
      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
